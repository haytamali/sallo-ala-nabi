<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>صلّوا على النبي ﷺ</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
      font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#ecfdf5,#f8fafc);color:#173b2a}
    main{width:min(100%,430px);background:white;border:1px solid #dceee3;border-radius:24px;
      padding:28px 22px;box-shadow:0 12px 40px #14532d18;text-align:center}
    .moon{font-size:34px;margin-bottom:8px}
    h1{font-size:27px;margin:8px 0;color:#166534}
    .sub{color:#64748b;line-height:1.8;margin:10px 0 22px}
    .count{font-size:54px;font-weight:800;color:#14532d;font-variant-numeric:tabular-nums;margin:12px 0}
    .label{font-size:14px;color:#64748b}
    button{width:100%;border:0;border-radius:16px;padding:17px 14px;margin-top:24px;
      background:#166534;color:white;font-size:20px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    .share{background:#e8f5ec;color:#14532d;margin-top:12px;font-size:16px}
    .status{min-height:24px;margin-top:14px;color:#64748b;font-size:13px}
    footer{font-size:12px;color:#94a3b8;margin-top:22px;line-height:1.7}
  </style>
</head>
<body>
<main>
  <div class="moon">☪️</div>
  <h1>صلّوا على النبي ﷺ</h1>
  <p class="sub">شارك في الذكر، وكل ضغطة تُضاف إلى العداد الجماعي بإذن الله.</p>
  <div class="count" id="count">—</div>
  <div class="label">إجمالي الضغطات من جميع المشاركين</div>
  <button id="pray" disabled>اللهم صلِّ وسلم على نبينا محمد ﷺ</button>
  <button class="share" id="share">مشاركة الحملة</button>
  <div class="status" id="status">جارٍ الاتصال بالعداد…</div>
  <footer>هذا عدّاد للمشاركة والتذكير، وليس دليلًا على عدد الصلوات المقبولة. تقبّل الله من الجميع.</footer>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // استبدل القيم التالية بإعدادات مشروع Firebase الخاص بك.
  const firebaseConfig = {
    apiKey: "ضع_apiKey_هنا",
    authDomain: "ضع_authDomain_هنا",
    databaseURL: "ضع_databaseURL_هنا",
    projectId: "ضع_projectId_هنا",
    appId: "ضع_appId_هنا"
  };

  const countEl = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const prayBtn = document.getElementById("pray");
  const shareBtn = document.getElementById("share");

  const configured = Object.values(firebaseConfig).every(v =>
    typeof v === "string" && v.length && !v.startsWith("ضع_")
  );

  if (!configured) {
    statusEl.textContent = "العداد جاهز، لكن يلزم ربطه بقاعدة بيانات Firebase أولًا.";
  } else {
    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);
      const countRef = ref(db, "campaigns/prayer/count");

      await signInAnonymously(auth);
      onValue(countRef, snapshot => {
        const value = snapshot.val();
        countEl.textContent = Number.isFinite(value) ? value.toLocaleString("ar-EG") : "0";
        statusEl.textContent = "متصل — العداد مشترك بين المشاركين.";
        prayBtn.disabled = false;
      }, error => {
        statusEl.textContent = "تعذر قراءة العداد. راجع إعدادات قاعدة البيانات.";
        console.error(error);
      });

      prayBtn.addEventListener("click", async () => {
        prayBtn.disabled = true;
        try {
          const result = await runTransaction(countRef, current => (Number(current) || 0) + 1);
          if (!result.committed) statusEl.textContent = "لم تتم إضافة الضغطة، حاول مرة أخرى.";
        } catch (error) {
          statusEl.textContent = "لم تنجح الإضافة. تحقق من الاتصال.";
          console.error(error);
        } finally {
          prayBtn.disabled = false;
        }
      });
    } catch (error) {
      statusEl.textContent = "فشل الاتصال. راجع إعدادات Firebase وتفعيل الدخول المجهول.";
      console.error(error);
    }
  }

  shareBtn.addEventListener("click", async () => {
    const data = { title: "صلّوا على النبي ﷺ", text: "شارك في حملة الصلاة على النبي ﷺ", url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else {
        await navigator.clipboard.writeText(location.href);
        statusEl.textContent = "تم نسخ رابط الحملة.";
      }
    } catch (_) {}
  });
</script>
</body>
</html>
